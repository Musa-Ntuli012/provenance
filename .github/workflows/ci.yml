name: CI

# PROVENANCE continuous integration.
#
# Gate (per DEVELOPER-coding-standards.md §4): lint, tests, build on every
# push and pull request, plus advisory security scans. Anything with a
# security expectation is exercised on every push, not just the unit tests.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend: lint, migrate, seed, test (MongoDB 7)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/provenance?replicaSet=rs0
      MONGODB_DB_NAME: provenance
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Single-node replica set: transactions (used by every mutating route)
      # require one, so the CI database runs the same shape as production.
      - name: Start MongoDB replica set
        run: |
          docker run -d --name provenance-mongo -p 27017:27017 mongo:7 --replSet rs0
          for i in $(seq 1 30); do
            if docker exec provenance-mongo mongosh --quiet \
              --eval 'try { rs.status() } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]}) }' \
              >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec provenance-mongo mongosh --quiet --eval 'db.adminCommand({hello: 1}).isWritablePrimary'
      - run: npm ci
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test

  frontend:
    name: Frontend: lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  dependencies:
    name: SCA: dependency audit (npm)
    runs-on: ubuntu-latest
    continue-on-error: true # advisory until triaged, flip to blocking once the baseline is clean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backend audit
        working-directory: backend
        run: npm audit --omit=dev || true
      - name: Frontend audit
        working-directory: frontend
        run: npm audit --omit=dev || true

  secrets:
    name: Secrets: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST: Semgrep
    runs-on: ubuntu-latest
    continue-on-error: true # advisory for the first runs, flip to blocking after triage
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto --error --exclude-rule generic.secrets.security.detected-generic-secret
