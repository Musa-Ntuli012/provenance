# PROVENANCE, continuous integration.
#
# Gate (per DEVELOPER-coding-standards.md §4): lint → tests → build,
# with SCA/dependency audit and secrets scanning as dedicated jobs.
#
# The backend job is the important one: it runs against a real PostgreSQL 17
# service with the same two-role model as production (owner + RLS-bound app
# role), so migrations, the seed, and every row-level-security expectation are
# exercised on every push, not just the unit tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend: lint, migrate, seed, test (Postgres 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: provenance
          POSTGRES_USER: provenance_owner
          POSTGRES_PASSWORD: postgres
          APP_ROLE_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provenance_owner -d provenance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://provenance_app:postgres@127.0.0.1:5432/provenance
      DATABASE_URL_ADMIN: postgresql://provenance_owner:postgres@127.0.0.1:5432/provenance
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test

  frontend:
    name: Frontend: lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  dependencies:
    name: SCA: dependency audit (npm)
    runs-on: ubuntu-latest
    continue-on-error: true # advisory until triaged, flip to blocking once the baseline is clean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan past commits too
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST: Semgrep
    runs-on: ubuntu-latest
    continue-on-error: true # advisory for the first runs, flip to blocking after triage
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/default --config p/owasp-top-ten --metrics=off
