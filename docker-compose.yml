# Local development database for PROVENANCE.
# Usage:
#   cp .env.example .env      # then edit the passwords
#   docker compose up -d
#   cd backend && cp .env.example .env  # fill in the SAME passwords + JWT_SECRET
#   npm run db:setup
#
# Two roles are created (see docker/init/01-roles.sh):
#   provenance_owner, owns the schema; runs migrations & seed; bypasses RLS.
#   provenance_app, runtime role; every query is constrained by
#                      row-level security to the request's tenant.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: provenance
      POSTGRES_USER: provenance_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_ROLE_PASSWORD: ${APP_ROLE_PASSWORD:?set APP_ROLE_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provenance_owner -d provenance"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
